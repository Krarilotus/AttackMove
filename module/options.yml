options:
- display: GroupBox
  category:
  - '{{bugfixes}}'
  header: '{{waypoints_group}}'
  hasHeader: true
  children:
  - url: attack-move.waypoints.always
    name: attack-move-waypoints-always
    text: '{{always}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: attack-move.waypoints.continue_move
    name: attack-move-waypoints-continue-move
    text: '{{continue_move}}'
    display: Switch
    contents:
      type: boolean
      value: true
- url: attack-move.stacking.alt
  name: attack-move-stacking-alt
  text: '{{alt}}'
  display: Switch
  contents:
    type: boolean
    value: true
  category:
  - '{{qol}}'
meta:
  version: 1.0.0
